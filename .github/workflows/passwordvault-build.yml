name: PasswordVault Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  native-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             curl             file             libayatana-appindicator3-dev             libgtk-3-dev             libssl-dev             libwebkit2gtk-4.1-dev             libxdo-dev             librsvg2-dev             patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
